<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Souel Mart — HCI-301 Interactive Prototype</title>
<style>
:root{
  --paper:#fbf7f5; --cream:#f1d8a0; --brown:#816548; --line:#9a8164;
  --taupe:#a78e71; --blue:#82a4b6; --green:#b8d9a8; --amber:#e7ca93;
  --ink:#242424; --shadow:0 18px 50px rgba(46,35,22,.22);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#efe7df;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.stage-wrap{min-height:100vh;display:grid;place-items:center;padding:0;background:#e9dfd6}
.stage{position:relative;width:min(100vw,2048px);aspect-ratio:2048/1447;background:#fff;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.stage img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;user-select:none;pointer-events:none}
.hotspot{position:absolute;border:0;background:transparent;padding:0;outline:none;border-radius:12px}
.hotspot:focus-visible{box-shadow:0 0 0 4px rgba(76,133,164,.35), inset 0 0 0 3px rgba(76,133,164,.7)}

.login-field-shell,.login-icon{display:none!important}
.login-input{
  position:absolute;
  left:58.0%;
  width:34.9%;
  height:5.35%;
  padding:0 1.8% 0 6.65%;
  border:0;
  background:transparent;
  outline:none;
  font-size:clamp(13px,1.16vw,23px);
  color:#4a443f;
  z-index:4;
  border-radius:22px;
}
.login-input.user{top:37.55%}
.login-input.pass{top:48.45%}
.login-input::placeholder{color:#6f6963;opacity:1}
.login-input:focus{box-shadow:none}
.login-options-row{position:absolute;left:57.75%;top:55.85%;width:24.9%;height:5.15%;display:flex;align-items:center;gap:32px;background:var(--paper);padding:0 1.2%;z-index:6}
.login-show,.login-keep{position:static!important;width:auto!important;height:auto!important;display:flex;align-items:center;gap:9px;font-size:clamp(10px,.9vw,20px);white-space:nowrap;color:#3f3b39}
.login-show input,.login-keep input{width:20px;height:20px;margin:0;accent-color:var(--brown);flex:0 0 auto}
.login-forgot{left:83.6%;top:56.6%;width:10.5%;height:4%}
.login-submit{left:63.9%;top:62.85%;width:23.6%;height:5.8%}
.create-link-cover{position:absolute;left:62.0%;top:72.2%;width:28.5%;height:4.2%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:clamp(10px,.95vw,20px)}
.create-link-cover button{border:0;background:none;color:#3e3a38;padding:0}
.create-link-cover b{color:var(--brown);text-decoration:underline;text-underline-offset:3px}

.nav-dashboard{left:1.55%;top:20.85%;width:15.25%;height:5.4%}
.nav-inventory{left:1.55%;top:28.15%;width:15.25%;height:5.4%}
.nav-receiving{left:1.55%;top:35.5%;width:15.25%;height:5.4%}
.nav-orders{left:1.55%;top:42.85%;width:15.25%;height:5.4%}
.nav-movement{left:1.55%;top:50.2%;width:15.25%;height:5.4%}
.nav-reports{left:1.55%;top:57.4%;width:15.25%;height:5.4%}
.nav-logout{left:2.0%;top:92.1%;width:14.5%;height:4.2%}

.add-product{left:83.1%;top:8.35%;width:13.4%;height:4.2%}
.filter-product{left:83.1%;top:3.55%;width:13.4%;height:4.2%}
.add-receiving{left:83.2%;top:8.1%;width:13.4%;height:4.1%}
.filter-receiving{left:83.2%;top:3.55%;width:13.4%;height:4.1%}
.order-action{left:83.2%;top:8.1%;width:13.4%;height:4.1%}
.filter-orders{left:83.2%;top:3.55%;width:13.4%;height:4.1%}
.filter-movement{left:83.2%;top:4.1%;width:13.4%;height:4.1%}
.movement-action{left:83.2%;top:9.0%;width:13.4%;height:4.1%}
.quick-add{left:60.0%;top:72.2%;width:35.2%;height:6.2%}
.quick-order{left:60.0%;top:79.5%;width:35.2%;height:6.2%}
.quick-report{left:60.0%;top:86.6%;width:35.2%;height:6.2%}
.lowstock-1{left:80.3%;top:44.45%;width:13.5%;height:4.5%}
.lowstock-2{left:80.3%;top:51.25%;width:13.5%;height:4.5%}
.lowstock-3{left:80.3%;top:58.05%;width:13.5%;height:4.5%}

.report-g1{left:50.35%;top:33.1%;width:8.3%;height:4.1%}
.report-g2{left:50.35%;top:48.8%;width:8.3%;height:4.1%}
.report-g3{left:50.35%;top:64.0%;width:8.3%;height:4.1%}
.report-g4{left:50.35%;top:79.4%;width:8.3%;height:4.1%}

.modal{position:fixed;inset:0;background:rgba(35,27,19,.42);display:grid;place-items:center;padding:18px;z-index:50}
.dialog{width:min(680px,95vw);max-height:92vh;overflow:auto;background:var(--paper);border:3px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:26px}
.dialog h2{margin:0 0 8px;color:var(--brown);font-size:30px}.dialog p{line-height:1.5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin:14px 0}.field label{display:block;font-weight:700;color:var(--brown);margin-bottom:6px}.field input,.field select{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:#fffdfa;outline:none;color:#3f3b39;-webkit-text-fill-color:#3f3b39;opacity:1}.field input::placeholder{color:#7d736b;opacity:1;-webkit-text-fill-color:#7d736b}.field select option{color:#3f3b39;background:#fffdfa}.field input:focus,.field select:focus{box-shadow:0 0 0 4px rgba(130,164,182,.2)}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}.btn{border:2px solid #796953;border-radius:11px;padding:11px 18px;font-weight:800}.btn.primary{background:var(--taupe);color:#fff}.btn.ghost{background:#fff;color:var(--brown)}
.notice{margin-top:10px;padding:11px 13px;border-radius:10px;background:#f5ead7;color:#6e563c}.error{margin-top:10px;color:#a23d34;font-weight:700}.ok{color:#36683c;font-weight:700}
.toast{position:fixed;right:22px;bottom:22px;z-index:80;background:#334b3a;color:#fff;padding:14px 18px;border-radius:12px;box-shadow:var(--shadow)}
.signup-panel{position:absolute;left:50.4%;top:0;width:49.6%;height:100%;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:4.5% 7%}
.signup-card{width:100%;max-width:610px}.signup-card h1{font-size:clamp(28px,3vw,55px);color:var(--brown);text-align:center;margin:0 0 7px}.signup-card .sub{text-align:center;color:var(--brown);font-weight:700;letter-spacing:1px;font-size:clamp(10px,.85vw,17px);margin-bottom:18px}.signup-card .field{margin:10px 0}.signup-card .field input,.signup-card .field select{padding:12px 14px}.signup-card .actions{justify-content:center}.signup-card .btn{min-width:180px}.signup-back{text-align:center;margin-top:14px;font-size:14px}.signup-back button{border:0;background:none;color:var(--brown);text-decoration:underline;font-weight:700}
.signup-card .field select{color:#3f3b39!important;-webkit-text-fill-color:#3f3b39!important;background:#fffdfa!important}.signup-card .field select option{color:#3f3b39!important;background:#fffdfa!important}
.password-hint{margin:-1px 0 8px;color:#7a6349;font-size:12px;line-height:1.35}.signup-password-tools{display:flex;align-items:center;gap:8px;margin:4px 0 8px;color:#5d5146;font-size:13px}.signup-password-tools input{width:17px;height:17px;accent-color:var(--brown)}

.search-overlay{position:absolute;border:0;background:var(--paper)!important;padding:0 .15%;font-size:clamp(11px,.74vw,15px);line-height:normal;outline:none;border-radius:0;color:#5a524c;z-index:5;caret-color:#5a524c;box-shadow:none!important;appearance:none;-webkit-appearance:none}
.search-overlay::placeholder{color:#6d665f;opacity:.92}
.search-overlay:focus{box-shadow:none}
.top-notify{left:84.55%;top:2.15%;width:2.75%;height:4.8%}
.top-profile{left:95.05%;top:1.65%;width:3.65%;height:5.25%;border-radius:50%;z-index:6}
.profile-photo{position:absolute;left:95.12%;top:1.72%;width:3.5%;aspect-ratio:1/1;border-radius:50%;object-fit:cover;z-index:5;pointer-events:none;background:#fff;border:2px solid #111}
.top-datetime{position:absolute;left:87.15%;top:3.05%;width:7.55%;height:2.50%;display:flex;align-items:center;justify-content:center;background:var(--paper);color:#242424;font-size:clamp(11px,.78vw,15px);font-weight:500;white-space:nowrap;overflow:hidden;z-index:7;pointer-events:none;text-align:center;padding:0 .15%}
.greeting-cover{position:absolute;left:22.6%;top:13.25%;width:41%;height:9.2%;background:transparent;z-index:3;padding:0}
.greeting-cover h1{margin:0;color:var(--brown);font-size:clamp(28px,3vw,60px);line-height:1.1}.greeting-cover p{margin:.8% 0 0;color:#a08769;font-size:clamp(12px,1.15vw,24px);letter-spacing:.5px}
.metrics-cover{position:absolute;left:22.35%;top:23.25%;width:74.2%;height:9.75%;z-index:3;display:grid;grid-template-columns:repeat(5,1fr);gap:1.05%;pointer-events:none}
.metric-card{background:transparent;border-radius:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;text-align:center;box-shadow:none}
.metric-label{font-size:clamp(9px,.74vw,16px);font-weight:700;text-transform:uppercase;margin-bottom:8px;line-height:1}.metric-value{font-size:clamp(22px,2.05vw,44px);font-weight:700;line-height:1}
.sidebar-profile-photo{position:absolute;left:2.4%;top:86.0%;width:3.5%;aspect-ratio:1/1;border-radius:50%;object-fit:cover;z-index:4;pointer-events:none;background:#f5e5c3;border:1px solid var(--brown)}
.sidebar-identity{position:absolute;left:5.95%;top:85.6%;width:11.8%;height:5.45%;z-index:5;background:var(--cream);display:flex;flex-direction:column;justify-content:center;padding-left:.28%;pointer-events:none}.sidebar-identity .name{font-size:clamp(13px,1.18vw,26px);font-weight:700;color:#16120f;line-height:1.12}.sidebar-identity .role{font-size:clamp(10px,.88vw,18px);color:#2f241b;letter-spacing:.32px;margin-top:4px;line-height:1.08}
.search-results{max-height:52vh;overflow:auto}.result-row{border:2px solid #d8c7b5;border-radius:12px;padding:12px 14px;margin:10px 0;background:#fff}.result-row b{color:var(--brown)}
.profile-preview-wrap{width:132px;height:132px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;margin:16px auto 18px;background:#eee;overflow:hidden;position:relative}.profile-preview-wrap img{width:100%;height:100%;object-fit:cover;display:block}.profile-preview-wrap .initials{font-size:38px;font-weight:800;color:var(--brown)}.profile-dialog .field{margin:12px 0}.profile-dialog .actions{flex-wrap:wrap}.profile-file{padding:10px!important;background:#fffdfa}

.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#efe0c5;color:#6c553d;font-size:12px;font-weight:700}
.orders-filter-overlay{
  position:absolute;
 
  left:21.73%;top:24.20%;width:75.30%;height:44.02%;
  z-index:4;
  background:var(--paper);
  overflow:hidden;
  border:0;
  border-radius:0;
}
.orders-filter-list{
  width:100%;
  height:100%;
  display:grid;
  grid-template-rows:repeat(6,1fr);
  align-items:stretch;
  padding:0;
}
.orders-filter-row{
  display:grid;
  grid-template-columns:25% 25% 25% 25%;
  align-items:stretch;
  padding:0;
  font-size:clamp(14px,1.06vw,20px);
  font-weight:400;
  color:#242424;
  font-family:Arial,Helvetica,sans-serif;
  line-height:1;
}
.orders-filter-row .orderno,
.orders-filter-row .customer,
.orders-filter-row .date,
.orders-filter-row .statuscell{
  display:flex;
  align-items:center;
  justify-content:center;
  height:100%;
  text-align:center;
  padding:0;
  margin:0;
}
.order-status{
  display:inline-flex;
  width:11.0vw;
  min-width:112px;
  max-width:158px;
  height:2.55vw;
  min-height:29px;
  max-height:37px;
  justify-content:center;
  align-items:center;
  padding:0 10px;
  border-radius:clamp(8px,.78vw,12px);
  border:2px solid #7b8790;
  font-weight:700;
  letter-spacing:1.5px;
  font-size:clamp(11px,.78vw,16px);
  line-height:1;
  text-transform:uppercase;
  font-family:Arial,Helvetica,sans-serif;
  box-sizing:border-box;
}
.order-status.pending{background:#e7ca93;color:#171717}
.order-status.picking{background:#82a4b6;color:#171717}
.order-status.ready{background:#dfa9ea;color:#171717}
.order-status.completed{background:#b8d9a8;color:#171717}
.orders-filter-blank{min-height:1px}
.orders-empty{
  position:absolute;inset:0;
  display:grid;place-items:center;
  color:#816548;font-weight:700;
  font-size:clamp(12px,1vw,19px);
}

.data-filter-overlay{
  position:absolute;
  z-index:4;
  background:var(--paper);
  overflow:hidden;
  border:0;
  border-radius:0;
}
.inventory-filter-overlay{left:21.92%;top:26.52%;width:74.86%;height:34.55%}
.receiving-filter-overlay{left:21.92%;top:26.38%;width:74.86%;height:34.35%}
.movement-filter-overlay{left:21.92%;top:27.28%;width:74.86%;height:31.85%}

.data-filter-list{
  width:100%;height:100%;
  display:grid;
  align-items:stretch;
  padding:0;
}
.inventory-filter-list,.receiving-filter-list,.movement-filter-list{grid-template-rows:repeat(5,1fr)}
.inventory-filter-list{padding-top:.78%;padding-bottom:.62%}
.receiving-filter-list{padding-top:.76%;padding-bottom:.60%}
.movement-filter-list{padding-top:.75%;padding-bottom:.60%}

.data-filter-row{
  display:grid;
  align-items:stretch;
  padding:0;
  font-size:clamp(14px,1.08vw,20px);
  font-weight:400;
  color:#242424;
  font-family:Arial,Helvetica,sans-serif;
  line-height:1;
}
.inventory-filter-row{grid-template-columns:23.6% 21.5% 16.5% 20.2% 18.2%}
.receiving-filter-row{grid-template-columns:26.8% 28.7% 24.8% 19.7%}
.movement-filter-row{grid-template-columns:18.0% 16.0% 18.8% 17.6% 14.7% 14.9%}

.data-filter-cell{
  display:flex;
  align-items:center;
  justify-content:center;
  height:100%;
  text-align:center;
  padding:0;
  margin:0;
}
.inventory-filter-row .product{text-align:center;justify-content:center;padding-left:0}
.movement-filter-row .product{text-align:center;justify-content:center;padding-left:0}

.table-status{
  display:inline-flex;
  width:12.6vw;
  min-width:132px;
  max-width:178px;
  height:2.95vw;
  min-height:34px;
  max-height:42px;
  justify-content:center;
  align-items:center;
  padding:0 14px;
  border-radius:12px;
  border:1.6px solid #93a0a8;
  font-weight:700;
  letter-spacing:1.35px;
  font-size:clamp(13px,.88vw,17px);
  line-height:1;
  text-transform:uppercase;
  box-sizing:border-box;
}
.table-status.in-stock,.table-status.received{background:#b8d9a8;color:#171717}
.table-status.low-stock,.table-status.pending{background:#e2cb96;color:#171717}
.qty-plus{color:#00b96b}
.qty-minus{color:#ff3b30}
.data-filter-empty{
  position:absolute;inset:0;
  display:grid;place-items:center;
  color:#816548;font-weight:700;
  font-size:clamp(12px,1vw,19px);
}

.cropper-dialog{width:min(620px,94vw)}
.cropper-dialog h2{text-align:center}
.crop-stage-wrap{display:grid;place-items:center;margin:18px 0}
.crop-stage{
  width:300px;height:300px;max-width:72vw;max-height:72vw;
  border-radius:50%;overflow:hidden;position:relative;
  border:4px solid var(--line);background:#ddd;
  cursor:grab;touch-action:none;user-select:none;
}
.crop-stage.dragging{cursor:grabbing}
.crop-stage img{
  position:absolute;left:50%;top:50%;
  max-width:none;max-height:none;
  transform-origin:center center;
  pointer-events:none;user-select:none;
}
.crop-guide{
  position:absolute;inset:0;border-radius:50%;
  box-shadow:0 0 0 9999px rgba(30,24,18,.34);
  border:2px solid rgba(255,255,255,.85);
  pointer-events:none;
}
.crop-controls{display:grid;gap:12px;margin-top:14px}
.crop-control-row{display:flex;align-items:center;gap:12px}
.crop-control-row label{min-width:58px;font-weight:700;color:var(--brown)}
.crop-control-row input[type=range]{flex:1;accent-color:var(--brown)}
.crop-hint{text-align:center;color:#725d47;font-size:13px;margin-top:8px}
.crop-toolbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:8px}


@media(max-width:800px){.stage-wrap{align-items:start;overflow:auto}.stage{width:1100px;max-width:none}.modal{align-items:start;padding-top:40px}.grid2{grid-template-columns:1fr}}
</style>

<body>
<div class="stage-wrap">
  <div class="stage" id="stage">
    <img id="bg" class="bg" alt="Souel Mart interface" />

    <div id="loginLayer">
      <div class="login-field-shell user" aria-hidden="true"></div>
      <div class="login-field-shell pass" aria-hidden="true"></div>
      <div class="login-icon user" aria-hidden="true"></div>
      <div class="login-icon pass" aria-hidden="true"></div>
      <input class="login-input user" id="loginUser" aria-label="Username or email" placeholder="Enter username or email" />
      <input class="login-input pass" id="loginPass" aria-label="Password" placeholder="Password" type="password" />
      <div class="login-options-row">
        <label class="login-show"><input type="checkbox" id="showPass"> <span>Show password</span></label>
        <label class="login-keep"><input type="checkbox" id="keepSigned"> <span>Keep me signed in</span></label>
      </div>
      <button class="hotspot login-forgot" aria-label="Forgot password" onclick="forgotPassword()"></button>
      <button class="hotspot login-submit" aria-label="Log in" onclick="login()"></button>
      <div class="create-link-cover">Don't have an account?&nbsp; <button onclick="openSignup()"><b>Create Account</b></button></div>
    </div>

    <div id="signupLayer" class="signup-panel hidden">
      <form class="signup-card" id="signupForm" novalidate>
        <h1>Create Account</h1>
        <div class="sub">REGISTER A SOUEL MART WAREHOUSE ACCOUNT</div>
        <div class="grid2"><div class="field"><label>First Name</label><input id="suFirstName" placeholder="Enter first name" /></div><div class="field"><label>Last Name</label><input id="suLastName" placeholder="Enter last name" /></div></div>
        <div class="field"><label>Username or Email</label><input id="suUser" placeholder="Enter username or email" /></div>
        <div class="grid2">
          <div class="field"><label>Password</label><input id="suPass" type="password" placeholder="Create password" /></div>
          <div class="field"><label>Confirm Password</label><input id="suPass2" type="password" placeholder="Confirm password" /></div>
        </div>
        <label class="signup-password-tools"><input type="checkbox" id="suShowPass"> <span>Show passwords</span></label>
        <div class="field"><label>Role</label><select id="suRole"><option>Warehouse Staff</option><option>Warehouse Supervisor</option></select></div>
        <div id="suMsg" aria-live="polite" style="min-height:24px;margin-top:8px"></div>
        <div class="actions"><button class="btn primary" id="createAccountBtn" type="button">CREATE ACCOUNT</button></div>
        <div class="signup-back">Already have an account? <button type="button" onclick="closeSignup()">Back to Login</button></div>
      </form>
    </div>

    <div id="appLayer" class="hidden">
      <input id="globalSearch" class="search-overlay" placeholder="Search anything..." aria-label="Search anything" />
      <button class="hotspot top-notify" id="topNotifyBtn" onclick="openNotifications()" aria-label="Notifications"></button>
      <button class="hotspot top-profile" id="topProfileBtn" onclick="openProfile()" aria-label="Profile"></button>
      <div id="topDateTime" class="top-datetime hidden">Week, Day | Time</div>
      <img id="profilePhotoTop" class="profile-photo hidden" alt="Profile photo" />
      <img id="profilePhotoSide" class="sidebar-profile-photo hidden" alt="Profile photo" />
      <div id="sidebarIdentity" class="sidebar-identity"><div id="sidebarFirstName" class="name">Name</div><div id="sidebarRole" class="role">Warehouse Staff</div></div>
      <div id="greetingOverlay" class="greeting-cover hidden"><h1 id="greetingText">Hello!</h1><p>Here's what's happening in your warehouse today</p></div>
      <div id="metricsOverlay" class="metrics-cover hidden"></div>
      <button class="hotspot nav-dashboard" onclick="showPage('dashboard')" aria-label="Dashboard"></button>
      <button class="hotspot nav-inventory" onclick="showPage('inventory')" aria-label="Inventory"></button>
      <button class="hotspot nav-receiving" onclick="showPage('receiving')" aria-label="Receiving"></button>
      <button class="hotspot nav-orders" onclick="showPage('orders')" aria-label="Orders"></button>
      <button class="hotspot nav-movement" onclick="showPage('movement')" aria-label="Stock movement"></button>
      <button class="hotspot nav-reports" onclick="showPage('reports')" aria-label="Reports"></button>
      <button class="hotspot nav-logout" onclick="logout()" aria-label="Logout"></button>
      <div id="inventoryFilterOverlay" class="data-filter-overlay inventory-filter-overlay hidden"></div>
      <div id="receivingFilterOverlay" class="data-filter-overlay receiving-filter-overlay hidden"></div>

  const firstEl=document.getElementById('suFirstName');

    const r=roleEl?.value||'Warehouse Staff';

function login(){
  const loginUserEl=document.getElementById('loginUser'),loginPassEl=document.getElementById('loginPass'),keepSignedEl=document.getElementById('keepSigned');
  const now=Date.now(); let guard=getLoginGuard();
  if(Number(guard.lockUntil||0)>now){const sec=Math.ceil((guard.lockUntil-now)/1000);toast(`Too many failed attempts. Try again in ${sec} second${sec===1?'':'s'}.`);return}
  if(Number(guard.lockUntil||0)&&Number(guard.lockUntil||0)<=now){guard={attempts:0,lockUntil:0};saveLoginGuard(guard)}
  let u=loginUserEl.value.trim(),p=loginPassEl.value,a=getAccountRecord();
  if(!u||!p){toast('Enter your username/email and password.');return}
  let defaultOK=(u.toLowerCase()==='Paolo'||u.toLowerCase()==='Paolo payawal'||u.toLowerCase()==='paolopayawal@gmail.com')&&p==='Password 123';
  let localOK=a&&u.toLowerCase()===String(a.user).toLowerCase()&&p===a.pass;
  if(!(defaultOK||localOK)){
    guard.attempts=Number(guard.attempts||0)+1;
    if(guard.attempts>=LOGIN_MAX_ATTEMPTS){guard={attempts:0,lockUntil:now+LOGIN_LOCK_MS};saveLoginGuard(guard);toast('Too many failed attempts. Login is locked for 30 seconds.')}
    else{saveLoginGuard(guard);const left=LOGIN_MAX_ATTEMPTS-guard.attempts;toast(`Incorrect username/email or password. ${left} attempt${left===1?'':'s'} remaining.`)}
    return
  }
  clearLoginGuard();
  let usr=localOK?{name:a.name,user:a.user,role:a.role}:{name:'Paolo Payawal',user:u,role:'Warehouse Staff'};let raw=JSON.stringify(usr);

}

function openProfile(){let u=activeUser()||{name:'User',user:'',role:'Warehouse Staff'},pic=localStorage.getItem('souelProfilePhoto')||'',initials=(u.name||'U').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();modal(`<div class="profile-dialog"><h2>My Profile</h2><p><span class="badge">${esc(u.role)}</span></p><div class="profile-preview-wrap"><img id="pfPreview" ${pic?`src="${pic}"`:'class="hidden"'}><span id="pfInitials" class="initials ${pic?'hidden':''}">${esc(initials||'U')}</span></div><div class="field"><label>Full Name</label><input id="pfName" value="${esc(u.name)}"></div><div class="field"><label>Username / Email</label><input value="${esc(u.user||'')}" disabled></div><div class="field"><label>Profile Picture</label><input class="profile-file" id="pfFile" type="file" accept="image/*" onchange="previewProfile(event)"></div><div class="notice">Choose an image, adjust the crop and position, then select Save Profile.</div><div class="actions"><button class="btn ghost" onclick="removeProfilePhoto()">Remove Photo</button><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveProfile()">Save Profile</button></div></div>`)}
let cropState={src:'',img:null,scale:1,x:0,y:0,rotation:0,dragging:false,lastX:0,lastY:0};

function previewProfile(e){
  const f=e.target.files&&e.target.files[0];
  if(!f)return;
  if(!f.type.startsWith('image/')){toast('Please choose a valid image file.');e.target.value='';return}
  const r=new FileReader();
  r.onload=()=>openImageAdjuster(r.result);
  r.readAsDataURL(f);
}

function openImageAdjuster(src){
  cropState={src, img:null, scale:1, x:0, y:0, rotation:0, dragging:false, lastX:0, lastY:0};
  modal(`<div class="cropper-dialog">
    <h2>Adjust Profile Picture</h2>
    <p style="text-align:center">Drag the image to reposition it, then use zoom or rotation if needed.</p>
    <div class="crop-stage-wrap">
      <div class="crop-stage" id="cropStage">
        <img id="cropImg" alt="Profile picture adjustment">
        <div class="crop-guide"></div>
      </div>
    </div>
    <div class="crop-controls">
      <div class="crop-control-row"><label>Zoom</label><input id="cropZoom" type="range" min="1" max="3" step="0.01" value="1"></div>
      <div class="crop-toolbar">
        <button class="btn ghost" type="button" onclick="rotateCrop(-90)">↺ Rotate Left</button>
        <button class="btn ghost" type="button" onclick="resetCrop()">Reset</button>
        <button class="btn ghost" type="button" onclick="rotateCrop(90)">Rotate Right ↻</button>
      </div>
    </div>
    <div class="crop-hint">The area inside the circle will be saved as your profile picture.</div>
    <div class="actions">
      <button class="btn ghost" type="button" onclick="openProfile()">Cancel</button>
      <button class="btn primary" type="button" onclick="applyCrop()">Use Photo</button>
    </div>
  </div>`);

  const img=document.getElementById('cropImg');
  const stage=document.getElementById('cropStage');
  const zoom=document.getElementById('cropZoom');
  cropState.img=img;
  img.onload=()=>{fitCropImage();renderCrop()};
  img.src=src;

  zoom.oninput=()=>{cropState.scale=parseFloat(zoom.value);renderCrop()};

  const start=(x,y)=>{cropState.dragging=true;cropState.lastX=x;cropState.lastY=y;stage.classList.add('dragging')};
  const move=(x,y)=>{
    if(!cropState.dragging)return;
    cropState.x+=x-cropState.lastX;
    cropState.y+=y-cropState.lastY;
    cropState.lastX=x;cropState.lastY=y;
    renderCrop();
  };
  const end=()=>{cropState.dragging=false;stage.classList.remove('dragging')};

  stage.addEventListener('mousedown',ev=>start(ev.clientX,ev.clientY));
  window.addEventListener('mousemove',ev=>move(ev.clientX,ev.clientY),{passive:true});
  window.addEventListener('mouseup',end,{passive:true});
  stage.addEventListener('touchstart',ev=>{const t=ev.touches[0];start(t.clientX,t.clientY)},{passive:true});
  stage.addEventListener('touchmove',ev=>{const t=ev.touches[0];move(t.clientX,t.clientY)},{passive:true});
  stage.addEventListener('touchend',end,{passive:true});
}

function fitCropImage(){
  const img=cropState.img, stage=document.getElementById('cropStage');
  if(!img||!stage)return;
  const size=stage.clientWidth;
  const base=Math.max(size/img.naturalWidth,size/img.naturalHeight);
  img.dataset.baseScale=base;
  cropState.scale=1;cropState.x=0;cropState.y=0;cropState.rotation=0;
  const z=document.getElementById('cropZoom');if(z)z.value='1';
}

function renderCrop(){
  const img=cropState.img;if(!img)return;
  const base=parseFloat(img.dataset.baseScale||1);
  const s=base*cropState.scale;
  img.style.width=(img.naturalWidth*s)+'px';
  img.style.height=(img.naturalHeight*s)+'px';
  img.style.transform=`translate(calc(-50% + ${cropState.x}px), calc(-50% + ${cropState.y}px)) rotate(${cropState.rotation}deg)`;
}

function rotateCrop(deg){cropState.rotation=(cropState.rotation+deg)%360;renderCrop()}
function resetCrop(){fitCropImage();renderCrop()}

function applyCrop(){
  const stage=document.getElementById('cropStage'), img=cropState.img;
  if(!stage||!img)return;
  const size=320, canvas=document.createElement('canvas');
  canvas.width=size;canvas.height=size;
  const ctx=canvas.getContext('2d');
  ctx.save();
  ctx.beginPath();ctx.arc(size/2,size/2,size/2,0,Math.PI*2);ctx.clip();

  const stageSize=stage.clientWidth;
  const ratio=size/stageSize;
  const base=parseFloat(img.dataset.baseScale||1);
  const drawScale=base*cropState.scale*ratio;
  const w=img.naturalWidth*drawScale,h=img.naturalHeight*drawScale;

  ctx.translate(size/2+cropState.x*ratio,size/2+cropState.y*ratio);
  ctx.rotate(cropState.rotation*Math.PI/180);
  ctx.drawImage(img,-w/2,-h/2,w,h);
  ctx.restore();

  const data=canvas.toDataURL('image/jpeg',0.9);
  openProfile();
  setTimeout(()=>{
    const im=document.getElementById('pfPreview'),ini=document.getElementById('pfInitials');
    if(im){im.src=data;im.dataset.pending=data;im.classList.remove('hidden')}
    if(ini)ini.classList.add('hidden');
    toast('Photo adjusted. Select Save Profile to keep it.');
  },0);
}
function saveProfile(){let u=activeUser()||{};let nameEl=document.getElementById('pfName'),im=document.getElementById('pfPreview');u.name=(nameEl&&nameEl.value.trim())||u.name||'User';let raw=JSON.stringify(u);if(localStorage.getItem('souelCurrentUser'))localStorage.setItem('souelCurrentUser',raw);else sessionStorage.setItem('souelCurrentUser',raw);if(im&&im.dataset.pending)localStorage.setItem('souelProfilePhoto',im.dataset.pending);let a=getAccountRecord();if(a&&a.user===u.user){a.name=u.name;saveAccountRecord(a)}closeModal();refreshUserUI();toast('Profile saved.')}

 ['Total Products',p.length],['Available Stock',p.reduce((a,x)=>a+Number(x.qty||0),0)],['Low Stock Products',p.filter(x=>Number(x.qty)<=10).length],['Incoming Deliveries',r.filter(x=>x.status==='Pending').length],['Pending Orders',o.filter(x=>x.status==='Pending').length]
]}

function searchCurrent(){let q=globalSearch.value.trim().toLowerCase();if(!q)return;let rows=[];if(current==='dashboard'||current==='inventory')rows=getProducts().filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(q))).map(x=>({title:x.name,detail:`${x.category} • Qty ${x.qty} • ${x.location}`,go:`productDetail('${String(x.name).replace(/'/g,"\\'")}')`}));
if(current==='receiving')rows=getReceivings().filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(q))).map(x=>({title:x.no,detail:`${x.supplier} • ${x.date} • ${x.status}`}));
if(current==='orders')rows=getOrders().filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(q))).map(x=>({title:x.no,detail:`${x.customer} • ${x.date} • ${x.status}`}));
if(current==='movement')rows=getProducts().filter(x=>x.name.toLowerCase().includes(q)||x.sku.toLowerCase().includes(q)).map(x=>({title:x.name,detail:`Current stock: ${x.qty} • ${x.location}`}));
if(current==='reports'){let names=['Inventory Report','Transaction Report','Low Stock Report','Order Report'];rows=names.filter(x=>x.toLowerCase().includes(q)).map((x,i)=>({title:x,detail:'Report available for generation',go:`generateReport(${names.indexOf(x)})`}))}
modal(`<h2>Search Results</h2><p>Results for <b>${esc(globalSearch.value)}</b> in ${esc(current)}</p><div class="search-results">${rows.length?rows.map(r=>`<div class="result-row"><b>${esc(r.title)}</b><div>${esc(r.detail)}</div>${r.go?`<div class="actions"><button class="btn primary" onclick="closeModal();${r.go}">Open</button></div>`:''}</div>`).join(''):'<div class="notice">No matching results found.</div>'}</div><div class="actions"><button class="btn ghost" onclick="closeModal()">Close</button></div>`)}
globalSearch.addEventListener('keydown',e=>{if(e.key==='Enter')searchCurrent()});
globalSearch.addEventListener('input',()=>{clearTimeout(window._st);if(globalSearch.value.trim().length>=2)window._st=setTimeout(searchCurrent,500)});
function addProduct(){modal(`<h2>Add Product</h2><p>Add a new warehouse item while keeping the form short and easy to scan.</p><div class="grid2"><div class="field"><label>Product Name</label><input id="pName"></div><div class="field"><label>Product ID / SKU</label><input id="pSku"></div><div class="field"><label>Category</label><input id="pCat"></div><div class="field"><label>Quantity</label><input id="pQty" type="number" min="0"></div><div class="field"><label>Location</label><input id="pLoc"></div><div class="field"><label>Supplier</label><input id="pSup"></div></div><div id="pErr"></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveProduct()">Save Product</button></div>`)}
function saveProduct(){if(!pName.value.trim()||!pSku.value.trim()||!pCat.value.trim()||pQty.value===''||!pLoc.value.trim()){pErr.className='error';pErr.textContent='Please complete all required product information.';return}let list=getProducts();list.push({name:pName.value.trim(),sku:pSku.value.trim(),category:pCat.value.trim(),qty:+pQty.value,location:pLoc.value.trim(),supplier:pSup.value.trim()});saveProducts(list);closeModal();toast('Product added successfully.');if(current==='dashboard')renderDashboardOverlays()}
function productDetail(name){let x=getProducts().find(p=>p.name===name)||{name,qty:'—',category:'—',location:'—',supplier:'—'};modal(`<h2>${esc(x.name)}</h2><p><b>Category:</b> ${esc(x.category)}<br><b>Quantity:</b> ${esc(x.qty)}<br><b>Location:</b> ${esc(x.location)}<br><b>Supplier:</b> ${esc(x.supplier)}</p><div class="actions"><button class="btn ghost" onclick="closeModal()">Close</button><button class="btn primary" onclick="closeModal();showPage('inventory')">Open Inventory</button></div>`)}
function addReceiving(){modal(`<h2>Receive New Inventory</h2><div class="field"><label>Delivery Number</label><input id="rNo"></div><div class="field"><label>Supplier</label><input id="rSup"></div><div class="grid2"><div class="field"><label>Product</label><select id="rProd">${getProducts().map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Quantity</label><input id="rQty" type="number" min="1" value="1"></div></div><div class="field"><label>Condition</label><select id="rCond"><option>Good</option><option>Damaged</option><option>For Inspection</option></select></div><div id="rErr"></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="reviewReceiving()">Review</button></div>`)}
function reviewReceiving(){if(!rNo.value.trim()||!rSup.value.trim()||+rQty.value<1){rErr.className='error';rErr.textContent='Enter the required receiving information.';return}window.rx={no:rNo.value.trim(),sup:rSup.value.trim(),prod:rProd.value,qty:+rQty.value,cond:rCond.value};modal(`<h2>Review Receiving</h2><p>Please review the information before confirming.</p><div class="notice"><b>Delivery:</b> ${esc(rx.no)}<br><b>Supplier:</b> ${esc(rx.sup)}<br><b>Product:</b> ${esc(rx.prod)}<br><b>Quantity:</b> ${esc(rx.qty)}<br><b>Condition:</b> ${esc(rx.cond)}</div><div class="actions"><button class="btn ghost" onclick="addReceiving()">Back / Correct</button><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="confirmReceiving()">Confirm</button></div>`)}
function confirmReceiving(){let p=getProducts(),idx=p.findIndex(x=>x.name===rx.prod);if(idx>=0)p[idx].qty+=Number(rx.qty);saveProducts(p);let r=getReceivings();r.unshift({no:rx.no,supplier:rx.sup,date:new Date().toLocaleDateString('en-US',{month:'long',day:'2-digit',year:'numeric'}),status:'Received'});saveReceivings(r);closeModal();toast('Receiving confirmed and stock updated.')}
function createOrder(){modal(`<h2>Create Order</h2><div class="field"><label>Customer</label><input id="oCustomer"></div><div class="grid2"><div class="field"><label>Product</label><select id="oProd">${getProducts().map(x=>`<option>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Quantity</label><input id="oQty" type="number" min="1" value="1"></div></div><div id="oErr"></div><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveOrder()">Create Order</button></div>`)}
function saveOrder(){if(!oCustomer.value.trim()||+oQty.value<1){oErr.className='error';oErr.textContent='Complete all required order information.';return}let prod=getProducts().find(x=>x.name===oProd.value);if(!prod||prod.qty<+oQty.value){oErr.className='error';oErr.textContent='Insufficient stock for this order.';return}window.newOrder={no:'ORD-'+String(getOrders().length+1).padStart(3,'0'),customer:oCustomer.value.trim(),product:oProd.value,qty:+oQty.value,date:new Date().toLocaleDateString('en-US',{month:'long',day:'2-digit',year:'numeric'}),status:'Pending'};let os=getOrders();os.unshift(newOrder);saveOrders(os);modal(`<h2>Order Created</h2><p>The order is now <b>Pending</b>. Continue through Pending → Picking → Ready → Completed.</p><div class="actions"><button class="btn primary" onclick="orderFlow('Picking')">Start Picking</button></div>`)}
function orderFlow(state){if(state==='Picking')modal(`<h2>Picking in Progress</h2><p>Mark the required item as picked.</p><label><input type="checkbox" id="picked"> ${esc(newOrder?.product||'Selected product')} — Qty ${esc(newOrder?.qty||1)}</label><div class="actions"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="if(!picked.checked){toast('Mark the item as picked first.')}else{orderFlow('Ready')}">Mark Ready</button></div>`);else if(state==='Ready')modal(`<h2>Order Ready</h2><p>All required items have been picked. The order is ready for completion.</p><div class="actions"><button class="btn primary" onclick="completeOrder()">Complete Order</button></div>`)}
function completeOrder(){let p=getProducts(),idx=p.findIndex(x=>x.name===newOrder.product);if(idx>=0)p[idx].qty-=Number(newOrder.qty);saveProducts(p);let os=getOrders(),oi=os.findIndex(x=>x.no===newOrder.no);if(oi>=0)os[oi].status='Completed';saveOrders(os);closeModal();toast('Order completed successfully.')}

function openInventoryFilter(){
  const categories=[...new Set(getProducts().map(p=>p.category))];
  modal(`<h2>Filter Inventory</h2>
    <div class="field"><label>Status</label>
      <select id="ifStatus">
        <option value="All">All Statuses</option>
        <option value="In Stock">In Stock</option>
        <option value="Low Stock">Low Stock</option>
      </select>
    </div>
    <div class="field"><label>Category</label>
      <select id="ifCategory">
        <option value="All">All Categories</option>
        ${categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}
      </select>
    </div>
    <div class="field"><label>Product / Location</label>
      <input id="ifKeyword" placeholder="e.g. Noodles or A-02">
    </div>
    <div class="actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn ghost" onclick="clearInventoryFilter();closeModal()">Clear Filter</button>
      <button class="btn primary" onclick="applyInventoryFilter()">Apply Filter</button>
    </div>`);
}

function applyInventoryFilter(){
  const status=document.getElementById('ifStatus').value;
  const category=document.getElementById('ifCategory').value;
  const keyword=document.getElementById('ifKeyword').value.trim().toLowerCase();
  const rows=getProducts().filter(p=>{
    const derived=Number(p.qty)<=10?'Low Stock':'In Stock';
    const statusOK=status==='All'||derived===status;
    const catOK=category==='All'||p.category===category;
    const keyOK=!keyword||[p.name,p.category,p.location,p.sku].some(v=>String(v).toLowerCase().includes(keyword));
    return statusOK&&catOK&&keyOK;
  });
  closeModal();
  if(status==='All'&&category==='All'&&!keyword){clearInventoryFilter(false);return}
  renderInventoryFilter(rows);
  toast(`${rows.length} product${rows.length===1?'':'s'} matched the filter.`);
}

function renderInventoryFilter(rows){
  const el=document.getElementById('inventoryFilterOverlay');if(!el)return;
  const visible=rows.slice(0,5), blanks=Math.max(0,5-visible.length);
  el.innerHTML=visible.length?`<div class="data-filter-list inventory-filter-list">
    ${visible.map(p=>{
      const st=Number(p.qty)<=10?'Low Stock':'In Stock';
      const cls=st==='Low Stock'?'low-stock':'in-stock';
      return `<div class="data-filter-row inventory-filter-row">
        <div class="data-filter-cell product">${esc(p.name)}</div>
        <div class="data-filter-cell">${esc(p.category)}</div>
        <div class="data-filter-cell">${esc(p.qty)}</div>
        <div class="data-filter-cell">${esc(p.location)}</div>
        <div class="data-filter-cell"><span class="table-status ${cls}">${st}</span></div>
      </div>`;
    }).join('')}
    ${Array.from({length:blanks},()=>'<div class="orders-filter-blank"></div>').join('')}
  </div>`:`<div class="data-filter-empty">No matching products found.</div>`;
  el.classList.remove('hidden');
}
function clearInventoryFilter(showToast=true){
  const el=document.getElementById('inventoryFilterOverlay');if(el){el.innerHTML='';el.classList.add('hidden')}
  if(showToast&&current==='inventory')toast('Inventory filter cleared.');
}
